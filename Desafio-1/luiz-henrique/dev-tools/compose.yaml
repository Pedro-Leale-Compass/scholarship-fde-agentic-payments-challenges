services:
  llama-server:
    container_name: llama-server
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3035:8080"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:z
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_CTX_SIZE=32000
      - LLAMA_ARG_MODELS_MAX=1
      - LLAMA_SERVER_SLOTS_DEBUG=true
      - LLAMA_ARG_MMPROJ_OFFLOAD=false
      - LLAMA_ARG_MLOCK=true
      # uses 15G extra ram
      - LLAMA_ARG_MMAP=false
      - LLAMA_ARG_CTX_CHECKPOINTS=64
      - LLAMA_ARG_FLASH_ATTN=on
      # Qwen3.5 2B Q8. unsloth publishes this GGUF as unsloth/Qwen3.5-2B-GGUF:<quant>; Q8_K_XL quant selected here.
      - LLAMA_ARG_HF_REPO=unsloth/Qwen3.5-2B-GGUF:UD-Q8_K_XL
    command: >
      --seed 42
      --temperature 1.0
      --top_p 1.00
      --top_k 20
      --min_p 0.0
      --presence_penalty 2.0
      --repeat_penalty 1.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
