[project]
name = "isabele-agent"
version = "1.0.0"
description = "Agente Strands de pagamentos para o Bedrock AgentCore Runtime"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.65.0,<2",
    "bedrock-agentcore>=1.26.0,<2",
    "boto3>=1.44.3,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
