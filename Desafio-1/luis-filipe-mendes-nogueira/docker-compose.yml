services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3001:80"
    restart: unless-stopped

  auth:
    profiles:
      - legado
    build:
      context: ./auth
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-}
    command:
      - sh
      - -c
      - |
        : "$${JWT_SECRET:?Defina JWT_SECRET para iniciar o perfil legado.}"
        node dist/db/seed.js && exec node dist/server.js
    restart: unless-stopped

  app:
    profiles:
      - legado
    build:
      context: .
      dockerfile: gemini-chat/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      NEXT_PUBLIC_AUTH_URL: http://localhost:4000
      AUTH_SERVICE_URL: http://auth:4000
      DB_PATH: /app/data/ingressos.db
    volumes:
      - ingressos_db:/app/data
    depends_on:
      - auth
    command:
      - sh
      - -c
      - |
        : "$${GEMINI_API_KEY:?Defina GEMINI_API_KEY para iniciar o perfil legado.}"
        node tickets-tools/dist/src/db/seed.js && exec node server.js
    restart: unless-stopped

volumes:
  ingressos_db:
